# DataChain Rust 配置文件

[server]
host = "0.0.0.0"
port = 8080

[database]
driver = "sqlite"
dsn = "./data/datachain.db"

[blockchain]
difficulty = 4
block_size = 100

[jwt]
secret = "your-secret-key-change-in-production"
expire_hours = 24
# refresh_expire_days = 7

[aggregation]
time_interval_secs = 3600
count_threshold = 100

[log]
level = "info"

# 认证参数(可选,缺省值即下列取值;未知键会使启动失败)。
# jwt.refresh_expire_days 默认 7(范围 1..=365,且不得短于 expire_hours)。
