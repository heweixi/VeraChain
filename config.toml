# DataChain Rust 配置文件

[server]
host = "0.0.0.0"
port = 8080
mode = "release"

[database]
dsn = "./data/datachain.db"

[blockchain]
difficulty = 4
block_size = 100

[jwt]
secret = "your-secret-key-change-in-production"
expire_hours = 24

[aggregation]
time_interval_secs = 3600
count_threshold = 100

[logging]
level = "info"
format = "json"
