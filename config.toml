# DataChain Rust 配置文件

[server]
host = "0.0.0.0"
port = 8080

[database]
driver = "sqlite"
dsn = "./data/datachain.db"

[blockchain]
difficulty = 4
block_size = 100

[jwt]
secret = "your-secret-key-change-in-production"
expire_hours = 24
# refresh_expire_days = 7

[aggregation]
time_interval_secs = 3600
count_threshold = 100

[log]
level = "info"

# 认证参数(可选,缺省值即下列取值;未知键会使启动失败)。
# jwt.expire_hours 范围 1..=720;jwt.refresh_expire_days 默认 7(范围 1..=365,且不得短于 expire_hours)。
# 各键均可用环境变量覆盖(DATACHAIN_AUTH_*、DATACHAIN_JWT_EXPIRE_HOURS、DATACHAIN_JWT_REFRESH_EXPIRE_DAYS),
# 完整参数表见 IMPLEMENTATION_STATUS.md §2.8。
# lockout_max_secs 须 >= lockout_base_secs,lockout_reset_secs 须 >= lockout_max_secs。
# trusted_proxies 的部署前提:可信代理必须把真实对端地址追加到 X-Forwarded-For。
# password_min_length(默认 8)同时作用于:公开注册、CLI `user create`、改密接口、CLI `user passwd`。
# [auth]
# login_user_max_attempts = 5
# login_ip_max_attempts = 20
# login_window_secs = 900
# lockout_base_secs = 900
# lockout_max_secs = 3600
# lockout_reset_secs = 86400
# audit_retention_days = 90
# active_cache_ttl_secs = 5
# password_min_length = 8   # 同时作用于注册、CLI 创建、改密与 CLI passwd 的新密码最小字符数(上限 72 字节)   # 最小字符数,同时作用于注册、CLI user create、改密、CLI user passwd(另有:UTF-8 字节 ≤ 72、无 NUL)
# trusted_proxies = []   # IP 或 CIDR,不允许 /0
