version: '3.8'

services:
  datachain-rust:
    build: .
    container_name: datachain-rust
    restart: unless-stopped
    ports:
      - "8004:8080"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - TZ=Asia/Shanghai
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - datachain-network

networks:
  datachain-network:
    driver: bridge
