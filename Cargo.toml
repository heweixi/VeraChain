[package]
name = "datachain"
version = "1.0.0"
edition = "2021"
description = "数据追溯区块链系统 - Rust 实现"

[[bin]]
name = "datachain"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
