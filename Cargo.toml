[package]
name = "datachain"
version = "1.0.0"
edition = "2021"
description = "数据追溯区块链系统 - Rust 实现"

[[bin]]
name = "datachain"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# core 模块所需(此前 Cargo.toml 遗漏,导致项目无法编译):
# canonical.rs/block.rs 的哈希与时间处理
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
