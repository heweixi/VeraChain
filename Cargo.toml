[package]
name = "datachain"
version = "0.1.0"
edition = "2021"
authors = ["DataChain Team"]
description = "数据追溯区块链系统 - Rust 实现"
license = "MIT"

[dependencies]
# Web 框架
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 数据库
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "postgres"] }

# 加密
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
bcrypt = "0.15"
argon2 = "0.5"
pbkdf2 = { version = "0.12", features = ["simple"] }
scrypt = "0.11"
hex = "0.4"

# JWT
jsonwebtoken = "9"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 配置
config = "0.14"

# 工具
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
parking_lot = "0.12"
glob = "0.3"
toml = "0.8"
lazy_static = "1.4"

# CLI
clap = { version = "4", features = ["derive"] }

# WebSocket
tokio-tungstenite = "0.21"
futures-util = "0.3"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[[bin]]
name = "datachain"
path = "src/main.rs"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"
