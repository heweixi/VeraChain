[package]
name = "datachain"
version = "1.0.0"
edition = "2021"
description = "数据追溯区块链系统 - Rust 实现"

[[bin]]
name = "datachain"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 以下依赖此前 Cargo.toml 全部遗漏,导致项目从未编译成功。按源码实际用法补齐:
# 哈希(core/crypto)
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"    # RustCrypto md-5(lib 名 md5,Digest 风格:Md5::new/update/finalize)
hex = "0.4"
# 时间(core/aggregation/api 等)
chrono = { version = "0.4", features = ["serde"] }
# 数据库(storage,SQLite + tokio 运行时)
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
# 认证(auth/jwt)
jsonwebtoken = "9"
# 密码哈希(crypto/hash.rs)
bcrypt = "0.15"
argon2 = "0.5"
pbkdf2 = "0.12"
scrypt = "0.11"
# UUID(多模块用 Uuid::new_v4)
uuid = { version = "1", features = ["v4"] }
# 错误处理(error.rs 的 thiserror 派生)
thiserror = "1"
# 全局单例(auth/permissions、utils/performance)
lazy_static = "1"
# CLI(cli/* 用 clap derive)
clap = { version = "4", features = ["derive"] }
# 并发锁(chain/websocket)
parking_lot = "0.12"
# 异步流(api/websocket)
futures-util = "0.3"
# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
