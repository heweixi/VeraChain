[package]
name = "datachain"
version = "1.0.0"
edition = "2021"
description = "数据追溯区块链系统 - Rust 实现"

[[bin]]
name = "datachain"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 以下依赖此前 Cargo.toml 全部遗漏,导致项目从未编译成功。按源码实际用法补齐:
# 哈希(core/crypto)
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"    # RustCrypto md-5(lib 名 md5,Digest 风格:Md5::new/update/finalize)
hex = "0.4"
# 时间(core/aggregation/api 等)
chrono = { version = "0.4", features = ["serde"] }
# 数据库(storage,SQLite + tokio 运行时)
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
# 认证(auth/jwt)
jsonwebtoken = "9"
# 密码哈希(crypto/hash.rs)
bcrypt = "0.15"
argon2 = "0.5"
pbkdf2 = "0.12"
scrypt = "0.11"
# UUID(多模块用 Uuid::new_v4)
uuid = { version = "1", features = ["v4"] }
# 错误处理(error.rs 的 thiserror 派生)
thiserror = "1"
# 全局单例(auth/permissions、utils/performance)
lazy_static = "1"
# HTTP P2P 同步客户端
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 节点与跨链锚定签名
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
async-trait = "0.1"
# CLI(cli/* 用 clap derive)
clap = { version = "4", features = ["derive"] }
# 并发锁(chain/websocket)
parking_lot = "0.12"
# 异步流(api/websocket)
futures-util = "0.3"
# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# 其它:错误(anyhow)、配置解析(toml)、文件匹配(glob)、版本信息
anyhow = "1"
toml = "0.8"
glob = "0.3"
rustc_version_runtime = "0.3"

[dev-dependencies]
tempfile = "3"    # versioning storage 测试用临时目录
tower = { version = "0.5", features = ["util"] }    # 集成测试用 oneshot 驱动 Router
http-body-util = "0.1"    # 集成测试读取响应 body

[profile.release]
opt-level = "s"
lto = true
strip = true
