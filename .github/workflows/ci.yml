name: DataChain Rust CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile and test
        run: cargo test --all-targets --all-features
      - name: Clippy
        # 现有代码保留若干风格级警告；将 correctness/编译错误保持为失败，
        # 对已登记的机械风格 lint 单独放宽，避免掩盖真正问题。
        run: >-
          cargo clippy --all-targets --all-features -- -D warnings
          -A unused_doc_comments -A unused_imports
          -A clippy::vec_init_then_push -A clippy::unnecessary_sort_by
          -A clippy::manual_strip -A clippy::unwrap_or_default
          -A clippy::too_many_arguments -A clippy::derivable_impls
          -A clippy::manual_is_multiple_of -A clippy::type_complexity
          -A clippy::io_other_error

  docker:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --tag datachain-rust:ci .
